name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Build binary
        run: |
          go mod tidy
          CGO_ENABLED=0 go build -ldflags="-s -w" -o Crayoz.bin .
          chmod +x Crayoz.bin

      - name: Create tarball
        run: |
          mkdir -p dist
          cp Crayoz.bin dist/
          cp README.md dist/ 2>/dev/null || true
          cp README.es.md dist/ 2>/dev/null || true
          cp LICENSE dist/ 2>/dev/null || true
          tar -czvf Crayoz-linux-amd64.tar.gz -C dist .

      - name: Generate Checksums
        run: |
          sha256sum Crayoz.bin Crayoz-linux-amd64.tar.gz > checksums.txt

      - name: Determine tag name
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        run: |
          gh release create "${{ steps.vars.outputs.tag }}" \
            Crayoz.bin \
            Crayoz-linux-amd64.tar.gz \
            checksums.txt \
            --title "Release ${{ steps.vars.outputs.tag }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
